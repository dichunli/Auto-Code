; ============================================================
; 微信群配件需求采集小工具 - 配置文件
; 改完保存后，重新运行 poller.py 生效
; ============================================================

[wechat]
; 目标群的群名（必须和微信里显示的群名一字不差）
; 多个群用英文逗号隔开，例如：groups = 配件采购群,业务沟通群
groups = ⊙﹏⊙配件订购   快车手

; 每隔多少秒检查一次新消息（建议 30，太小电脑会累）
interval = 30

[paths]
; 采集结果输出到哪个文件夹（看板网页和图片都在里面）
; 本服务器配置：输出到脚本目录下的"输出"文件夹（私有），
; 由网站路由 /wechat-board/ 实时读磁盘提供给登录用户（放 public 会被 Next 当构建期静态文件，新图 404）
; 访问地址：http://localhost:3000/wechat-board/配件需求看板.html
output = ./输出

; 解密数据库副本的临时工作区（含完整聊天记录，务必留在非公开目录）
; 默认 ./_工作区 表示脚本同目录下的"_工作区"文件夹，一般不用改
workdir = ./_工作区

[ocr]
; 可选功能：识别照片里的车牌号（让"只拍照不打字"的消息也能归到正确车牌下）
; 不开也能用——只要发消息时文字里写了车牌就能正确归类
; 开通方法见 README 的「可选：开启照片车牌识别」
enabled = false
baidu_api_key =
baidu_secret_key =

