; ============================================================
; 微信群配件需求采集小工具 - 配置文件
; 改完保存后，重新运行 poller.py 生效
; ============================================================

[wechat]
; 目标群的群名（必须和微信里显示的群名一字不差）
; 多个群用英文逗号隔开，例如：groups = 配件采购群,业务沟通群
groups = 在此填写群名

; 每隔多少秒检查一次新消息（建议 30，太小电脑会累）
interval = 30

[paths]
; 采集结果输出到哪个文件夹（看板网页和图片都在里面）
; 默认 ./输出 表示脚本同目录下的"输出"文件夹
output = ./输出

[ocr]
; 可选功能：识别照片里的车牌号（让"只拍照不打字"的消息也能归到正确车牌下）
; 不开也能用——只要发消息时文字里写了车牌就能正确归类
; 开通方法见 README 的「可选：开启照片车牌识别」
enabled = false
baidu_api_key =
baidu_secret_key =

